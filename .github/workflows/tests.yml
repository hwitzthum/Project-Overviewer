name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"

jobs:
  migration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # node:test migration/boot guards (database.js). These boot a real server
      # against crafted database states; no browser or frontend build required.
      - run: npm run test:migrations

  # The Playwright suite is the only thing covering the frontend and the
  # request/response surface end to end. It ran locally-only for a long time,
  # which meant a green PR said nothing about whether the app actually worked.
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Cache the browser binaries, not the system packages. Keyed on the lock
      # file so a Playwright bump re-downloads instead of running new code
      # against a stale browser.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # playwright.config.js declares no `projects`, so the suite runs on
      # Chromium alone — no reason to download the other two.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # `pretest` runs the esbuild build first: public/dist/ is generated and
      # deliberately untracked (see the no-tracked-build-output check), so the
      # bundles have to be produced here or every page 404s on its scripts.
      - run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            /tmp/project-overviewer-playwright-report
            /tmp/project-overviewer-test-results
          retention-days: 7
          if-no-files-found: ignore
